<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart | Olamileken Electronics</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f5a524'/><text x='50' y='70' font-size='60' text-anchor='middle'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Checkout</span>
        <h1>Your cart</h1>
        <p>Send your order and we’ll call you to confirm. Pay on delivery or at pickup — no card needed online.</p>
      </div>
    </section>

    <div class="container" id="cartRoot">
      <div class="cart-layout">
        <div class="cart-items" id="cartItems"></div>

        <aside class="summary form-card" id="checkout">
          <h2 style="font-size:1.3rem">Order summary</h2>
          <div id="summaryRows"></div>

          <form id="orderForm" novalidate>
            <h3 style="font-size:1.05rem;margin-top:20px">Your details</h3>
            <div class="form-grid">
              <div class="field full">
                <label for="name">Full name</label>
                <input id="name" name="name" required maxlength="100" autocomplete="name">
              </div>
              <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" type="tel" required placeholder="080…" autocomplete="tel">
              </div>
              <div class="field">
                <label for="email">Email <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
                <input id="email" name="email" type="email" autocomplete="email">
              </div>
              <div class="field full">
                <label>How do you want it?</label>
                <div class="radio-cards">
                  <label class="radio-card"><input type="radio" name="deliveryMethod" value="delivery" checked> <span><i class="fas fa-truck"></i> Delivery</span></label>
                  <label class="radio-card"><input type="radio" name="deliveryMethod" value="pickup"> <span><i class="fas fa-store"></i> Store pickup</span></label>
                </div>
              </div>
              <div class="field full" id="addressField">
                <label for="address">Delivery address</label>
                <input id="address" name="address" maxlength="300" autocomplete="street-address" placeholder="Street, area, city">
              </div>
              <div class="field full">
                <label for="note">Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
                <textarea id="note" name="note" maxlength="1000" style="min-height:80px" placeholder="Preferred brand, size, delivery time…"></textarea>
              </div>
            </div>
            <button class="btn btn-amber btn-block" type="submit" style="margin-top:16px"><i class="fas fa-paper-plane"></i> Place order</button>
            <div class="form-status" id="orderStatus" role="alert"></div>
          </form>
        </aside>
      </div>
    </div>
  </main>

  <script type="module" src="/js/cart.js"></script>
</body>
</html>
