<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Olamileken Electronics</title>
  <meta name="description" content="Browse TVs, fridges, freezers, kitchen and laundry appliances, fans, generators and stabilizers from Olamileken Electronics, Ibadan.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f5a524'/><text x='50' y='70' font-size='60' text-anchor='middle'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Catalog</span>
        <h1>Shop electronics</h1>
        <p>Add items to your cart and send the order — we’ll call to confirm price, stock and delivery.</p>
      </div>
    </section>

    <div class="container shop-layout">
      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-magnifying-glass"></i>
          <label for="search" class="visually-hidden">Search products</label>
          <input id="search" type="search" placeholder="Search TVs, fans, generators…" autocomplete="off">
        </div>
        <label for="sort" class="visually-hidden">Sort by</label>
        <select id="sort">
          <option value="">Sort: Recommended</option>
          <option value="newest">Newest first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <div class="chips" id="chips" role="tablist" aria-label="Categories"></div>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
      <div class="product-grid" id="productGrid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/shop.js"></script>
</body>
</html>
